<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fished Fashion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="header-left">
        <a href="#" class="logo">
            <img id="logo" class="logo" src="images/logo.png" alt="Fished Fashion Logo">
        </a>

        <nav class="nav">
            <a href="#">Shop</a>
            <a href="#">About us</a>
        </nav>
    </div>

    <a href="#" class="brand">
        Fished Fashion
    </a>

    <div class="header-right">

        <button class="language">
            NL
        </button>

        <button class="icon-button" aria-label="Zoeken">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16" y1="16" x2="21" y2="21"></line>
            </svg>
        </button>

        <button class="icon-button" aria-label="Account">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="7" r="4"></circle>
                <path d="M4 21v-2c0-4 3-6 8-6s8 2 8 6v2"></path>
            </svg>
        </button>

        <button class="icon-button cart-button" aria-label="Winkelmand">
            <svg viewBox="0 0 24 24">
                <path d="M5 7h14l-1 13H6L5 7z"></path>
                <path d="M8 7V5c0-2 1.5-3 4-3s4 1 4 3v2"></path>
                <circle cx="12" cy="11" r="2"></circle>
            </svg>

            <span id="cartCount" class="cart-count">0</span>
        </button>

    </div>

</header>


<main class="product-page">

    <section class="product-image-section">

        <div class="product-image-wrapper">

            <img
                id="productImage"
                class="product-image"
                src="images/shirt.png"
                alt="Fished Fashion kledingstuk"
            >

        </div>

    </section>


    <section class="product-info">

        <h1>RefurbFished Shirt</h1>

        <p class="price">
            € <span id="price">34,99</span>
        </p>


        <div class="option-row">

            <span class="option-label">Size</span>

            <div class="sizes">

                <button
                    class="size-button"
                    data-size="S"
                >
                    S
                </button>

                <button
                    class="size-button"
                    data-size="M"
                >
                    M
                </button>

                <button
                    class="size-button"
                    data-size="L"
                >
                    L
                </button>

            </div>

        </div>

        <div class="buy-row">

            <div class="quantity">

                <button id="minus">
                    -
                </button>

                <span id="quantity">
                    1
                </span>

                <button id="plus">
                    +
                </button>

            </div>


            <button id="addToCart" class="add-cart">
                + Winkelmand
            </button>

        </div>


        <p class="description">
            Uitleg product
        </p>


        <div id="message" class="message"></div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
